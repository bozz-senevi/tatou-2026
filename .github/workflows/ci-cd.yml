name: CI/CD

# Tests + image build run on every push and PR (GitHub-hosted runners).
# Deploy runs only for pushes to main, on the self-hosted runner installed
# on the Tatou VM (it pulls the new code and recreates the containers).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# One in-flight run per branch; a newer push cancels the older CI run.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (incl. RMAP git dep)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        # Tests import `from server import app`; create_app() opens the DB
        # lazily and healthz tolerates no DB, so no database is needed here.
        run: pytest -q

  security:
    name: Security scan (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true   # surfaces issues without blocking the pipeline
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanners
        run: pip install bandit pip-audit
      - name: Bandit (static analysis of src/)
        run: bandit -r src -ll
      - name: pip-audit (known-vulnerable dependencies)
        run: pip-audit || true

  integration:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: test
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tatou
          MARIADB_USER: tatou
          MARIADB_PASSWORD: tatou
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: tatou
      DB_USER: tatou
      DB_PASSWORD: tatou
      SECRET_KEY: ci-secret-not-production
      STORAGE_DIR: /tmp/tatou-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install server and DB client
        run: |
          python -m pip install --upgrade pip
          pip install -e ./server
          sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Load database schema
        run: mariadb -h 127.0.0.1 -P 3306 -uroot -proot < db/tatou.sql

      - name: Start the server (gunicorn, background)
        run: |
          mkdir -p "$STORAGE_DIR"
          cd server
          gunicorn -b 127.0.0.1:5000 server:app \
            --access-logfile - --error-logfile - > /tmp/gunicorn.log 2>&1 &
          echo $! > /tmp/gunicorn.pid

      - name: Wait for healthz with DB connected
        run: |
          for i in $(seq 1 20); do
            body=$(curl -s http://127.0.0.1:5000/healthz || true)
            echo "attempt $i: $body"
            if echo "$body" | jq -e '.db_connected == true' >/dev/null 2>&1; then
              echo "server healthy, DB connected"; exit 0
            fi
            sleep 2
          done
          echo "---- gunicorn log ----"; cat /tmp/gunicorn.log; exit 1

      - name: Smoke test the auth API
        run: |
          set -e
          BASE=http://127.0.0.1:5000

          echo "== create-user (expect 201) =="
          code=$(curl -s -o /tmp/cu.json -w '%{http_code}' -X POST $BASE/api/create-user \
            -H 'Content-Type: application/json' \
            -d '{"login":"ci","email":"ci@test.local","password":"CiPass123!"}')
          cat /tmp/cu.json; echo " (HTTP $code)"
          test "$code" = "201"

          echo "== login (expect token) =="
          curl -s -X POST $BASE/api/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.local","password":"CiPass123!"}' > /tmp/login.json
          cat /tmp/login.json; echo
          TOKEN=$(jq -r '.token' /tmp/login.json)
          test -n "$TOKEN" -a "$TOKEN" != "null"

          echo "== list-documents with token (expect 200) =="
          code=$(curl -s -o /tmp/ld.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" $BASE/api/list-documents)
          cat /tmp/ld.json; echo " (HTTP $code)"
          test "$code" = "200"

          echo "== list-documents without token (expect 401) =="
          code=$(curl -s -o /dev/null -w '%{http_code}' $BASE/api/list-documents)
          echo "unauthenticated -> HTTP $code"
          test "$code" = "401"

          echo "All smoke checks passed."

      - name: Stop the server
        if: always()
        run: kill "$(cat /tmp/gunicorn.pid)" 2>/dev/null || true

  build:
    name: Build server image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (validates the Dockerfile)
        run: docker build -t tatou-server:ci ./server

  deploy:
    name: Deploy to VM
    runs-on: [self-hosted, tatou-vm]
    needs: [test, integration, build]
    # Only real pushes to main deploy; PRs and feature branches stop at CI.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Pull latest and recreate containers
        # Deploy in the live checkout on the VM, which holds the gitignored
        # .env, server/keys/, and the docker volumes. DEPLOY_DIR is a repo
        # variable (Settings > Secrets and variables > Actions > Variables).
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          echo "Deploying commit ${GITHUB_SHA} in $(pwd)"
          git fetch --all --prune
          git checkout main
          git reset --hard "origin/main"
          docker compose up -d --build
          docker compose ps
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/healthz || true)
            if [ "$code" = "200" ]; then
              echo "healthz OK (HTTP 200)"
              curl -s http://localhost:5000/healthz; echo
              exit 0
            fi
            echo "waiting for server... ($i/15, last=$code)"
            sleep 4
          done
          echo "Server did not become healthy in time"
          cd "${DEPLOY_DIR}" && docker compose logs --tail=50 server
          exit 1
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
