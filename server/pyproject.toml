[project]
name = "Tatou-Server"
version = "0.0.1"
description = "PDF Watermarking platform"
requires-python = ">=3.11"
dependencies = [
	"PyMuPDF>=1.21.1",
	"Flask==3.0.3",
	"gunicorn==21.2.0",
	"PyMySQL==1.1.2",
	"SQLAlchemy==2.0.43",
	"dill==0.4.0",
	"rmap @ https://github.com/nharrand/RMAP/releases/download/v2.0.0/rmap-2.0.0-py3-none-any.whl"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test/"]
python_files = ["test_*.py"]

[project.scripts]
pdfwm = "watermarking_cli:main"                 # now you can run `pdfwm methods`

[tool.mutmut]
source_paths = ["src/server.py"]
mutate_only_covered_lines = true
pytest_add_cli_args_test_selection = ["test/test_api.py"]
also_copy = [
    "src/watermarking_utils.py",
    "src/watermarking_method.py",
    "src/add_after_eof.py",
    "src/iman_wm.py",
    "src/stealth_invisible_watermark.py",
    "src/sussann_watermark.py",
    "src/unsafe_bash_bridge_append_eof.py",
]